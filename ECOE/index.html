<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0D12">
<title>Estaciones ECOE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#F8F9FB; --sunk:#EFF1F4;
  --border:#E3E6EB; --border2:#CDD2DA;
  --text:#0F1729; --muted:#596273; --faint:#8C94A3;
  --s1:#0D9488; --s2:#4F46E5; --s3:#C2690A; --s4:#DB2756;
  --on-c:#FFFFFF; --warn:#B45309; --over:#DC2626; --ok:#16A34A;
  --shadow-sm:0 1px 2px rgba(15,23,41,.06);
  --shadow:0 1px 2px rgba(15,23,41,.05),0 12px 32px -8px rgba(15,23,41,.12);
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D12; --surface:#12151C; --surface2:#171B23; --sunk:#0E1117;
    --border:#232834; --border2:#323948;
    --text:#E8EAEE; --muted:#A1A9B6; --faint:#6B7381;
    --s1:#2DD4BF; --s2:#8B93FF; --s3:#F5B544; --s4:#FB7193;
    --on-c:#0B0D12; --warn:#F5B544; --over:#F87171; --ok:#4ADE80;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -10px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D12; --surface:#12151C; --surface2:#171B23; --sunk:#0E1117;
  --border:#232834; --border2:#323948;
  --text:#E8EAEE; --muted:#A1A9B6; --faint:#6B7381;
  --s1:#2DD4BF; --s2:#8B93FF; --s3:#F5B544; --s4:#FB7193;
  --on-c:#0B0D12; --warn:#F5B544; --over:#F87171; --ok:#4ADE80;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);--c:var(--text);
  font:15.5px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--s1),var(--s2) 45%,var(--s3) 75%,var(--s4));color:#fff}
.logo svg{width:17px;height:17px}
.brand b{font-weight:700;letter-spacing:-.01em;font-size:.98rem;display:block;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap}
.stepper{display:flex;gap:2px;list-style:none;margin:0;padding:4px;background:var(--sunk);border:1px solid var(--border);border-radius:999px}
.stepper li{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:999px;font-size:.8rem;font-weight:500;color:var(--faint);white-space:nowrap;transition:background .2s,color .2s}
.stepper li i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700;
  border:1.5px solid var(--border2)}
.stepper li.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.stepper li.on i{background:var(--c);border-color:var(--c);color:var(--on-c)}
.stepper li.done{color:var(--muted)} .stepper li.done i{border-color:var(--c);color:var(--c)}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.clock{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  font-size:1.08rem;font-weight:700;min-width:104px;justify-content:center}
.clock svg{width:16px;height:16px;color:var(--faint)}
.clock.idle{color:var(--faint)}
.clock.run svg{color:var(--c)}
.clock.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.clock.warn svg{color:var(--warn)}
.clock.over{color:#fff;background:var(--over);border-color:var(--over);animation:pulse 1s infinite}
.clock.over svg{color:#fff}
@keyframes pulse{50%{opacity:.75}}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--border2)}
.icon-btn svg{width:17px;height:17px}
.tbar{height:3px;background:transparent}
.tbar i{display:block;height:100%;width:0;background:var(--c);transition:width .25s linear}

main{max-width:1280px;margin:0 auto;padding:28px 20px 110px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 20px;
  font-weight:600;background:var(--text);color:var(--bg);font-size:.95rem;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.92} .btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--border2)}
.btn.sm{padding:8px 13px;font-size:.84rem;border-radius:10px}
.btn.sm svg{width:15px;height:15px}

/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end;margin-bottom:26px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px}
.eyebrow b{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.hero h1{font-size:clamp(1.9rem,4.2vw,2.9rem);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin:14px 0 12px}
.hero p{color:var(--muted);margin:0;max-width:56ch;font-size:1rem}
.how{list-style:none;margin:0;padding:16px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.how li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:.88rem;color:var(--muted)}
.how li b{color:var(--text);font-weight:600}
.how li span:first-child{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--text);font-weight:700;font-size:.8rem}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.tile .n{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.tile b{display:block;font-size:1rem;letter-spacing:-.01em;margin:6px 0 4px}
.tile p{margin:0;font-size:.84rem;color:var(--muted)}
.tile .prio{margin-top:10px;font-size:.74rem;color:var(--faint)}
.pick{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:22px}
.pick summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:.9rem;list-style:none;display:flex;align-items:center;gap:8px}
.pick summary::-webkit-details-marker{display:none}
.pick summary svg{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.pick[open] summary svg{transform:rotate(90deg)}
.pick summary small{font-weight:400;color:var(--faint)}
.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 16px}
.pick-grid label{font-size:.78rem;color:var(--muted);display:grid;gap:5px;font-weight:500}
select{padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);width:100%}
.start{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.note{font-size:.8rem;color:var(--faint);margin:0;max-width:62ch}

/* ---------- estación ---------- */
.st-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.kicker::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}
.st-bar h1{font-size:clamp(1.35rem,2.6vw,1.75rem);letter-spacing:-.025em;font-weight:800;margin:6px 0 2px;line-height:1.15}
.st-bar p{margin:0;color:var(--muted);font-size:.9rem}
.st-actions{display:flex;gap:8px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.col-card{position:sticky;top:86px;max-height:calc(100vh - 104px);overflow-y:auto;overscroll-behavior:contain;border-radius:20px;
  scrollbar-width:thin;padding:2px}

.scene{perspective:1800px}
.card{display:grid;transition:transform .75s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);min-width:0}
.front{align-self:start;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 24px;
  position:relative;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 0%,color-mix(in srgb,var(--c) 13%,transparent),transparent 70%),
    linear-gradient(var(--surface),var(--surface))}
.front::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:28px 28px;mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent)}
.front>*{position:relative}
.front:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.front .num{font-size:5.6rem;font-weight:800;letter-spacing:-.06em;line-height:1;color:var(--c)}
.front h2{font-size:1.35rem;letter-spacing:-.02em;font-weight:700;margin:12px 0 6px}
.front p{color:var(--muted);margin:0;font-size:.92rem}
.front .tap{margin-top:28px;display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;
  background:var(--c);color:var(--on-c);border-radius:999px;padding:10px 18px;box-shadow:0 6px 20px -6px var(--c)}
.front .tap svg{width:16px;height:16px}
.card:not(.flip) .front{cursor:pointer}
.card:not(.flip) .front:hover .tap{transform:translateY(-1px)}
.back{transform:rotateY(180deg);padding:20px 20px 18px;position:relative}
.back::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:18px 18px 0 0;background:var(--c)}
.card:not(.flip) .back{visibility:hidden}
.card.flip .front{pointer-events:none}
.sec{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.sec:first-child{margin-top:2px}
.tarjeta{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.92rem;margin:0}
.tarjeta dt{font-weight:600;color:var(--muted);font-size:.8rem;padding-top:2px}
.tarjeta dd{margin:0}
.consigna{display:flex;gap:10px;padding:11px 13px;background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);
  border-radius:12px;margin-top:14px;font-size:.92rem}
.consigna svg{width:17px;height:17px;color:var(--c);margin-top:2px}
.caso{font-size:.96rem;margin:0}
.dx{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;margin:0}
.labs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.labs li{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.ef-q{font-size:1.15rem;line-height:1.45;margin:6px 0 0;letter-spacing:-.01em}

/* chat */
.chat{margin-top:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--sunk)}
.chat-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--muted);background:var(--surface)}
.chat-h .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.chat-h span:last-child{margin-left:auto;color:var(--faint)}
.log{height:280px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.log .hint{color:var(--faint);font-size:.86rem;text-align:center;margin:auto 12px}
.msg{max-width:86%;padding:8px 12px;border-radius:14px;font-size:.92rem;line-height:1.45}
.msg.q{align-self:flex-end;background:var(--c);color:var(--on-c);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.a small{display:block;font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:1px}
.msg.typing{color:var(--faint);letter-spacing:.2em}
.ask{display:flex;gap:8px;padding:9px;border-top:1px solid var(--border);background:var(--surface)}
.ask input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.ask input:focus{outline:2px solid var(--c);outline-offset:-1px;border-color:transparent}
.ask button{border:0;border-radius:10px;width:40px;display:grid;place-items:center;background:var(--c);color:var(--on-c)}
.ask button svg{width:17px;height:17px}

/* panel de respuestas */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm);container-type:inline-size}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-h b{font-size:1rem;letter-spacing:-.01em}
.panel-h small{color:var(--faint);font-size:.8rem;margin-left:auto}
.panel-b{padding:6px 18px 18px}
.panel.locked{border-style:dashed;box-shadow:none;background:transparent;min-height:440px;display:grid;place-items:center;text-align:center;color:var(--faint);padding:24px}
.panel.locked svg{width:26px;height:26px;margin-bottom:8px}
.panel.locked p{margin:0;font-size:.9rem;max-width:30ch}
.panel.in{animation:rise .45s ease both .3s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
@container (min-width:520px){.row{grid-template-columns:190px 1fr;gap:16px}.row>label{padding-top:8px}}
.row>label{font-weight:600;font-size:.88rem}
.row>label small{display:block;font-weight:400;color:var(--faint);font-size:.76rem}
textarea,.panel input[type=text]{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);line-height:1.5;resize:vertical;font-size:.93rem}
textarea:focus,.panel input[type=text]:focus{outline:2px solid var(--c);outline-offset:-1px;border-color:transparent;background:var(--surface)}
.multi{display:grid;gap:6px}
.multi .it{display:flex;gap:8px;align-items:center}
.multi .it span{width:18px;text-align:right;color:var(--faint);font-size:.8rem;font-variant-numeric:tabular-nums}
.add{justify-self:start;border:1px dashed var(--border2);background:transparent;border-radius:8px;padding:4px 11px;font-size:.8rem;color:var(--muted);margin-left:26px}
.add:hover{color:var(--text);border-color:var(--text)}

/* próxima estación */
.next{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:30;
  display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--c) 70%,#000);border-radius:999px;padding:8px 10px 8px 14px;
  font-weight:600;font-size:.84rem;background:var(--c);color:var(--on-c);box-shadow:0 8px 22px -8px color-mix(in srgb,var(--c) 70%,#000)}
.next:hover{filter:brightness(1.06)}
.next svg{width:15px;height:15px}
.next small{opacity:.75;font-weight:500;margin-left:2px}
.next[hidden]{display:none}
.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:40;background:var(--over);color:#fff;
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);animation:rise .3s ease both}

/* final */
.fin-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.fin-h h1{font-size:clamp(1.7rem,3.5vw,2.3rem);letter-spacing:-.035em;font-weight:800;margin:10px 0 4px}
.fin-h p{color:var(--muted);margin:0}
.res{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.res>summary{cursor:pointer;padding:14px 16px;list-style:none;display:flex;gap:12px;align-items:center}
.res>summary::-webkit-details-marker{display:none}
.res>summary .badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:800;font-size:.85rem;flex:none}
.res>summary .tt{min-width:0}
.res>summary .tt b{display:block;font-size:.95rem}
.res>summary .tt span{font-size:.82rem;color:var(--muted)}
.res>summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s;width:18px;height:18px}
.res[open]>summary .chev{transform:rotate(90deg)}
.res-b{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.9rem;min-width:0}
.box h4{margin:0 0 8px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.box ul,.box ol{margin:0 0 8px;padding-left:18px} .box li{margin:3px 0}
.box .k{font-weight:600;margin-top:8px}
.box .k:first-of-type{margin-top:0}
.box .empty{color:var(--faint);font-style:italic}
.box pre{white-space:pre-wrap;font:inherit;margin:0}
.box p{margin:0 0 6px}
.ef{display:grid;gap:8px}
.ef div{border-top:1px dashed var(--border);padding-top:7px}
.ef div:first-child{border-top:0;padding-top:0}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.tag.n{color:var(--ok)} .tag.p{color:var(--over)}

@media (max-width:1020px){
  .layout{grid-template-columns:1fr}
  .col-card{position:static;max-height:none;overflow:visible}
  .panel.locked{min-height:0}
  .hero{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .pick-grid{grid-template-columns:1fr 1fr}
  .stepper li span{display:none}
  .stepper li{padding:5px}
}
@media (max-width:640px){
  .top-in{grid-template-columns:auto 1fr auto;padding:8px 12px;gap:8px}
  .brand small,.brand b{display:none}
  .stepper{justify-self:center}
  .clock{min-width:84px;font-size:.98rem;padding:5px 10px 5px 8px}
  main{padding:20px 14px 100px}
  .tiles,.pick-grid,.res-b{grid-template-columns:1fr}
  .back{padding:18px 14px}
  .tarjeta{grid-template-columns:1fr;gap:2px} .tarjeta dt{padding-top:6px}
  .front{min-height:360px}
  .panel-b{padding:4px 14px 14px} .panel-h{padding:12px 14px}
  .next{font-size:.78rem;padding:7px 9px 7px 12px;right:12px;bottom:12px}
  .next svg{width:13px;height:13px}
}
@media (max-width:370px){.stepper li i{width:18px;height:18px}.icon-btn{width:34px;height:34px}}
