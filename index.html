<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<title>Plataformas de Estudo</title>
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --border:#DDE1E7;
  --text:#1A1D23; --muted:#5B6472;
  --rev:#0F8F82; --mir:#B4441F; --far:#5B4BC4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115; --surface:#171A21; --border:#2A2F3A;
    --text:#E6E8EB; --muted:#9AA3AF;
    --rev:#4FD1C5; --mir:#F0906A; --far:#A99BFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A21; --border:#2A2F3A;
  --text:#E6E8EB; --muted:#9AA3AF;
  --rev:#4FD1C5; --mir:#F0906A; --far:#A99BFF;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px 48px}
h1{font:600 1.7rem/1.2 ui-serif,Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c);
  border-radius:12px;padding:18px 16px;margin-bottom:14px;transition:transform .1s}
a.card:active{transform:scale(.98)}
.ic{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
  font:700 1rem/1 ui-monospace,Consolas,monospace;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent)}
.card b{display:block;font-size:1.08rem}
.card span{color:var(--muted);font-size:.9rem}
.arr{margin-left:auto;color:var(--muted);font-size:1.3rem}
footer{color:var(--muted);font-size:.8rem;margin-top:28px}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Plataformas de Estudo</h1>
  <p class="sub">Revalida · MIR · Farmacologia</p>

  <a class="card" style="--c:var(--rev)" href="Revalida/hub/">
    <div class="ic">RV</div>
    <div><b>Revalida Hub</b><span>Banco INEP 2011–2026 · módulos comentados</span></div>
    <div class="arr">›</div>
  </a>

  <a class="card" style="--c:var(--mir)" href="MIR/hub/">
    <div class="ic">MIR</div>
    <div><b>MIR Hub</b><span>Banco de preguntas y calendario</span></div>
    <div class="arr">›</div>
  </a>

  <a class="card" style="--c:var(--far)" href="Farmaco/hub/">
    <div class="ic">FX</div>
    <div><b>Farmaco Hub</b><span>Farmacoterapia, pediatría y microbiología</span></div>
    <div class="arr">›</div>
  </a>

  <footer>Dica: no celular, use “Adicionar à tela inicial” para abrir como app.</footer>
</main>
</body>
</html>
